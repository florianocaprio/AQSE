services:
  backend:
    build:
      context: ./backend
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    command:
      - sh
      - -c
      - CI=true pnpm install --frozen-lockfile && pnpm run dev -- --host 0.0.0.0 --port 3000
    environment:
      VITE_API_PROXY_TARGET: "${VITE_API_PROXY_TARGET:-http://backend:8000}"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  frontend_node_modules:
